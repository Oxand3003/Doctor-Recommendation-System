spring.application.name=recomendacion_medicos

spring.datasource.url=${MEDICERCA_DB_URL:jdbc:mysql://localhost:3306/medicerca?serverTimezone=America/Lima&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:12345678}

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

medicerca.admin.email=${ADMIN_EMAIL:admin@medicerca.local}
medicerca.admin.password=${ADMIN_PASSWORD:Admin123!}
