# esta es la api key reemplazar: ${GROQ_API_KEY:}  por:  la clave real (lo mande por WhatsApp) y quitar el comentario de la linea.  La clave real no se debe subir al repositorio.

medicerca.ai.api-key=${GROQ_API_KEY:} 
medicerca.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
medicerca.ai.model=${AI_MODEL:openai/gpt-oss-120b}
medicerca.ai.system-prompt=${AI_SYSTEM_PROMPT:Eres un asistente de orientacion medica. No diagnostiques ni prescribas. Ayuda a elegir una especialidad y solicita los datos necesarios para filtrar medicos.}









# Fotos de perfil de los médicos: carpeta en disco (los metadatos van en la tabla fotos_medico)
medicerca.uploads.dir=${UPLOADS_DIR:./uploads}
# Límite de subida: la validación real (5 MB por foto) está en FotoStorageService
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=64MB


spring.config.import=optional:file:./config/mail.local.properties

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=davidalv.987654321@gmail.com
spring.mail.password=sqge xvda sams cejp
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
# Puerto 587 = STARTTLS (por defecto). Puerto 465 = SSL: MAIL_PORT=465, MAIL_SSL=true y MAIL_STARTTLS=false.
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
# Tiempos maximos (ms) para que un SMTP caido no deje colgada una peticion web
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente visible. En Gmail debe ser la misma cuenta autenticada (o un alias configurado en ella).
medicerca.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
medicerca.mail.from-name=${MAIL_FROM_NAME:MediCerca}
# true = al arrancar prueba la conexion y el login SMTP (NO envia ningun correo) y lo deja en el log
medicerca.mail.verify-on-startup=${MAIL_VERIFY_ON_STARTUP:false}

# Direccion publica de la aplicacion: se usa para el enlace "Iniciar sesion" del correo de aprobacion.
medicerca.app.base-url=${APP_BASE_URL:http://localhost:8080}
# Codigos de seguridad (cambio de contrasena / correo): vigencia, intentos, espera entre envios y tope por hora
medicerca.security.code-ttl-minutes=${CODE_TTL_MINUTES:10}
medicerca.security.code-max-attempts=${CODE_MAX_ATTEMPTS:5}
medicerca.security.code-resend-seconds=${CODE_RESEND_SECONDS:60}
medicerca.security.code-max-per-hour=${CODE_MAX_PER_HOUR:5}

# Desactivación de administradores: votos de administradores distintos necesarios (mínimo 2).
medicerca.admin.desactivacion.votos-requeridos=${ADMIN_DESACTIVACION_VOTOS:2}
