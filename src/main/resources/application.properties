spring.application.name=recomendacion_medicos

# Las páginas HTML de error muestran mensajes seguros y nunca detalles internos.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never



# Credenciales y host de MySQL configurados mediante variables de entorno
# (DB_HOST permite apuntar a una base remota, ej. para desplegar el backend
# en Render usando el MySQL de un VPS).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/medicerca?useSSL=${DB_USE_SSL:false}&serverTimezone=America/Lima&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Puerto HTTP: Render (y otros PaaS) lo asignan dinamicamente via $PORT.
server.port=${PORT:8080}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# El administrador inicial se crea cuando se configuran ambos valores.
medicerca.admin.email=${ADMIN_EMAIL:}
medicerca.admin.password=${ADMIN_PASSWORD:}






spring.jpa.open-in-view=false
spring.sql.init.mode=never

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax



medicerca.admin.2fa.ttl-minutes=${ADMIN_2FA_TTL_MINUTES:10}
medicerca.admin.2fa.max-attempts=${ADMIN_2FA_MAX_ATTEMPTS:5}
medicerca.admin.2fa.resend-seconds=${ADMIN_2FA_RESEND_SECONDS:60}

medicerca.demo-data=true

# Distritos disponibles para registrar sedes y filtrar médicos.
# Nota: "Víctor" usa el escape Unicode en vez de la tilde directa porque los archivos
# .properties se leen como ISO-8859-1 por el formato del archivo (no por la codificacion del
# sistema), y esa tilde se corrompia al cargarla aunque el archivo en si estuviera en UTF-8 valido.
medicerca.distritos-permitidos=Trujillo,Alto Trujillo,El Porvenir,Florencia de Mora,Huanchaco,La Esperanza,Laredo,Moche,Salaverry,V\u00edctor Larco Herrera








# Asistente de IA (chat de orientacion por sintomas y por zona del cuerpo): usa Google Gemini a traves
# de su API compatible con el formato chat/completions (plan gratuito). La clave se crea en
# https://aistudio.google.com/apikey y se configura en la variable de entorno AI_API_KEY.
medicerca.ai.api-key=${AI_API_KEY:}
medicerca.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
# Uno o varios modelos separados por coma, en orden de preferencia: si el primero esta saturado (503),
# sin cuota (429) o no responde a tiempo, se usa el siguiente y el que fallo se pausa 2 minutos.
medicerca.ai.model=${AI_MODEL:gemini-3.5-flash-lite,gemini-3.8-flash}
# Nivel de razonamiento (low | medium | high). Los modelos Gemini 3 "piensan" antes de responder y con
# su nivel por defecto la respuesta tardaba mas que el tiempo de espera; con "low" basta para conversar.
# Si un modelo no acepta el parametro, se le deja de enviar automaticamente.
medicerca.ai.reasoning-effort=${AI_REASONING_EFFORT:low}
# Segundos maximos que se espera a cada modelo antes de pasar al siguiente (o a las reglas internas).
medicerca.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:12}
medicerca.ai.system-prompt=${AI_SYSTEM_PROMPT:Eres un asistente de orientacion medica. No diagnostiques ni prescribas. Ayuda a elegir una especialidad y solicita los datos necesarios para filtrar medicos.}









# Fotos de perfil de los médicos: carpeta en disco (los metadatos van en la tabla fotos_medico)
medicerca.uploads.dir=${UPLOADS_DIR:./uploads}
# Límite de subida: la validación real (5 MB por foto) está en FotoStorageService
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=64MB


spring.config.import=optional:file:./config/mail.local.properties

# Envio de correo via la API HTTP de Resend (https://resend.com), NO por SMTP directo: Render (y
# varios PaaS gratuitos) bloquean las conexiones salientes a los puertos de SMTP (25/465/587), asi
# que un correo por SMTP nunca llega aunque las credenciales esten bien. La API de Resend va por
# HTTPS (puerto 443), que nunca se bloquea.
medicerca.resend.api-key=${RESEND_API_KEY:}
# Remitente visible. El dominio de este correo debe estar verificado en Resend
# (o usar el remitente de pruebas onboarding@resend.dev mientras tanto).
medicerca.mail.from=${MAIL_FROM:}
medicerca.mail.from-name=${MAIL_FROM_NAME:MediCerca}
# true = al arrancar prueba que la clave de Resend es valida (NO envia ningun correo) y lo deja en el log
medicerca.mail.verify-on-startup=${MAIL_VERIFY_ON_STARTUP:false}

# Direccion publica de la aplicacion: se usa para el enlace "Iniciar sesion" del correo de aprobacion.
medicerca.app.base-url=${APP_BASE_URL:http://localhost:8080}
# Codigos de seguridad (cambio de contrasena / correo): vigencia, intentos, espera entre envios y tope por hora
medicerca.security.code-ttl-minutes=${CODE_TTL_MINUTES:10}
medicerca.security.code-max-attempts=${CODE_MAX_ATTEMPTS:5}
medicerca.security.code-resend-seconds=${CODE_RESEND_SECONDS:60}
medicerca.security.code-max-per-hour=${CODE_MAX_PER_HOUR:5}

# Bloqueo de cuenta por intentos de inicio de sesión fallidos seguidos.
medicerca.security.login-max-intentos=${LOGIN_MAX_INTENTOS:3}
medicerca.security.login-bloqueo-minutos=${LOGIN_BLOQUEO_MINUTOS:15}

# Desactivación de administradores: votos de administradores distintos necesarios (mínimo 2).
medicerca.admin.desactivacion.votos-requeridos=${ADMIN_DESACTIVACION_VOTOS:2}