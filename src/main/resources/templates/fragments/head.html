<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Usage in a page:
  <head th:replace="~{fragments/head :: head('Page title', 'home')}"></head>
  2nd argument = file name (without .css) inside static/css/pages/
-->
<head th:fragment="head(title, pageCss)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">MediCerca</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
  <!-- Pide el token CSRF antes de enviar el cuerpo de la página: así se crea a tiempo la sesión donde se guarda.
       Si se pide recién en un formulario al final de una página larga (contacto del inicio), la respuesta ya
       empezó a enviarse, la sesión no se puede crear y el visitante sin sesión recibe 403 al enviar. -->
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{|/css/pages/${pageCss}.css?v=home-reveal-20261020|}">
  <link rel="stylesheet" th:if="${pageCss == 'home' and nav != null and nav.paciente()}" th:href="@{/css/pages/account.css?v=patient-finder-20261021}">
  <script th:src="@{/js/components/navbar.js}" defer></script>
</head>
</html>
