<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Usage in a page:
  <head th:replace="~{fragments/head :: head('Page title', 'home')}"></head>
  2nd argument = file name (without .css) inside static/css/pages/
-->
<head th:fragment="head(title, pageCss)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">MediCerca</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{|/css/pages/${pageCss}.css?v=home-reveal-20261020|}">
  <script th:src="@{/js/components/navbar.js}" defer></script>
</head>
</html>
